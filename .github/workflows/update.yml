name: 更新成大演講

on:
  schedule:
    - cron: "17 22 * * *"   # 每天台灣時間 06:17
    - cron: "17 6 * * *"    # 每天台灣時間 14:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scraper/main.py
      - name: 存檔
        run: |
          git config user.name "lecture-bot"
          git config user.email "lecture-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "更新演講 $(TZ=Asia/Taipei date +%F_%H%M)"
          git push
